<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEMP EYE 👁 — AI Payment Agent TEST</title><style>body{margin:0;background:#071018;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:24px}.eye{width:112px;height:72px;border:3px solid #9edcff;border-radius:70% 10%;transform:rotate(45deg);margin:25px auto 35px;display:grid;place-items:center;box-shadow:0 0 35px #4cb8ff55}.pupil{width:34px;height:34px;border-radius:50%;background:#9edcff;box-shadow:0 0 25px #9edcff;transform:rotate(-45deg)}h1{text-align:center}.tag{text-align:center;color:#9edcff;margin:8px 0 24px}.card{background:#0d1a24;border:1px solid #28445a;border-radius:22px;padding:20px;margin:14px 0}.msg{line-height:1.6}.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stage{border:1px solid #31526b;background:#102333;color:#eaf6ff;border-radius:14px;padding:13px;cursor:pointer}.stage.active{border-color:#9edcff;box-shadow:0 0 18px #4cb8ff33}.stage small{display:block;color:#8caabd;margin-top:4px}.cta{width:100%;border:0;border-radius:15px;padding:15px;margin-top:16px;font-weight:700;font-size:16px;cursor:pointer;background:#9edcff;color:#061018}.cta:disabled{opacity:.45}.status{min-height:24px;margin-top:14px;color:#9edcff}.mode{display:inline-block;border:1px solid #d6a83f;color:#ffd979;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.note{font-size:13px;color:#8da5b6;line-height:1.5}.result{word-break:break-all;background:#061019;border-radius:12px;padding:12px;font-size:12px;display:none}</style></head><body><div class="wrap"><div class="eye"><div class="pupil"></div></div><h1>KEMP EYE 👁 AI Payment Agent</h1><div class="tag"><span class="mode">RAZORPAY TEST MODE</span></div><section class="card"><div class="msg" id="agentMsg"><strong>KEMP EYE AI:</strong> Welcome. Select the stage you want to test.</div><div class="stages" id="stages"></div><button class="cta" id="payBtn" disabled>START ₹333 TEST PAYMENT</button><div class="status" id="status"></div><div class="result" id="result"></div></section><section class="card"><div class="note"><strong>TEST ONLY.</strong> This page is for checking the payment flow. It does not modify the verified 112-day audit or locked index. No live payment keys are included.</div></section></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>const WORKER_URL='https://kemp-eye-112-payments-test.kishansaraiya9.workers.dev';const stages=[['L1','Days 13–17'],['L2','Days 18–22'],['L3','Days 23–27'],['L4','Days 28–32'],['L5','Days 33–37'],['L6','Days 38–42'],['L7','Days 43–47'],['L8','Days 48–52'],['L9','Days 53–57'],['L10','Days 58–62'],['L11','Days 63–67'],['L12-20','Days 68–112']];let selected=null;const box=document.getElementById('stages'),pay=document.getElementById('payBtn'),msg=document.getElementById('agentMsg'),status=document.getElementById('status'),result=document.getElementById('result');for(const [key,days] of stages){const b=document.createElement('button');b.className='stage';b.innerHTML='<strong>'+key+'</strong><small>'+days+'</small>';b.onclick=()=>{selected=key;document.querySelectorAll('.stage').forEach(x=>x.classList.remove('active'));b.classList.add('active');pay.disabled=false;msg.innerHTML='<strong>KEMP EYE AI:</strong> You selected <strong>'+key+'</strong> ('+days+'). This is a ₹333 TEST MODE payment. After Razorpay confirms it, the secure backend will verify it.';status.textContent='Ready for test checkout.'};box.appendChild(b)}function base(){return WORKER_URL.replace(/\/$/,'')}async function order(){const r=await fetch(base()+'/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({stage_key:selected})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Could not create test order');return d}async function verify(p,o){const r=await fetch(base()+'/api/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({checkout_token:o.checkout_token,razorpay_payment_id:p.razorpay_payment_id,razorpay_order_id:p.razorpay_order_id,razorpay_signature:p.razorpay_signature})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Verification failed');return d}pay.onclick=async()=>{if(!selected)return;pay.disabled=true;status.textContent='KEMP EYE AI is creating the secure TEST order…';try{const o=await order();const rz=new Razorpay({key:o.key_id,amount:o.amount,currency:o.currency,name:'KEMP EYE 👁',description:'KEMP EYE '+selected+' — TEST MODE',order_id:o.order_id,handler:async p=>{try{status.textContent='KEMP EYE AI is verifying the test payment…';const a=await verify(p,o);status.textContent='TEST PAYMENT VERIFIED ✓';msg.innerHTML='<strong>KEMP EYE AI:</strong> Test payment verified for <strong>'+a.stage_key+'</strong>.';result.textContent='Test access token: '+a.access_token;result.style.display='block'}catch(e){status.textContent=e.message}pay.disabled=false},modal:{ondismiss:()=>{status.textContent='Test checkout closed.';pay.disabled=false}},theme:{color:'#9edcff'}});rz.open()}catch(e){status.textContent=e.message;pay.disabled=false}}</script></body></html>
