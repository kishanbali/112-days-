<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050711"><title>KEMP EYE 👁 10-DAY REJUVENATION QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.app{width:min(720px,100%);height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 35%,#15302b,#050711 74%)}header{padding:16px;text-align:center}.brand{font-weight:900;letter-spacing:.16em}.sub{font-size:10px;letter-spacing:.16em;color:#a7b1bf;margin-top:5px}.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}.orb{width:min(58vw,260px);height:min(58vw,260px);border-radius:50%;background:radial-gradient(circle,#fff 0 2%,#82e1c2 3% 8%,rgba(130,225,194,.15) 9% 35%,transparent 36%);box-shadow:0 0 70px rgba(130,225,194,.24);animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.25)}}.eye{position:absolute;width:94px;height:60px;border:2px solid #eee;border-radius:70% 12%;transform:rotate(45deg);box-shadow:0 0 28px rgba(130,225,194,.55);display:grid;place-items:center}.eye:before{content:"";width:29px;height:29px;border-radius:50%;background:radial-gradient(circle,#fff 0 10%,#82e1c2 11% 38%,#10211e 39% 66%,transparent 67%)}.center{position:absolute;text-align:center}.day{font-size:42px;font-weight:950}.label{font-size:9px;letter-spacing:.25em;color:#a7b1bf}.panel{padding:15px 18px 18px;background:linear-gradient(transparent,#050711 20%)}.battery{height:14px;border:1px solid #26313b;border-radius:99px;padding:2px;position:relative}.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#55c9a4,#b7f3dc);transition:.5s}.pct{position:absolute;inset:0;text-align:center;font-size:8px;line-height:9px}.prompt{text-align:center;font-size:13px;color:#aab3c5;min-height:38px;padding:10px 4px}.row{display:flex;gap:10px}.btn{flex:1;border:1px solid #252d3d;border-radius:14px;padding:14px 8px;background:#111827;color:#fff;font-weight:850}.primary{background:#72d9ba;color:#06100c;border:0}.note{text-align:center;font-size:9px;color:#6f7a92;line-height:1.5;margin-top:9px}</style></head><body><main class="app"><header><div class="brand">KEMP EYE 👁</div><div class="sub">10-DAY REJUVENATION QUEST</div></header><section class="stage"><div class="orb"></div><div class="eye"></div><div class="center"><div class="day" id="day">01</div><div class="label">DAY</div></div></section><section class="panel"><div class="battery"><div class="fill" id="fill"></div><div class="pct" id="pct">0%</div></div><div class="prompt" id="prompt">Arrive. Let the experience begin.</div><div class="row"><button class="btn primary" id="begin">▶ BEGIN DAY</button><button class="btn" id="next">NEXT DAY</button></div><div class="note">Experience only. No questions, tick marks, recording or personal data. The battery is a visual journey indicator, not a health measurement.</div></section></main><script>const P=['Arrive. Let the experience begin.','Feel the rhythm of breathing without changing it.','Soften the eyes and notice light, shape and space.','Place one hand on the chest and stay with sensation.','Listen closely to the smallest sound you can notice.','Notice the space around your body while remaining still.','Gently hold your shoulders in a quiet self-embrace.','Let sight, sound and touch share the same moment.','Rest without trying to improve anything.','Remain here for one final quiet moment.'];let d=1,running=false,end=0;const day=document.getElementById('day'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),prompt=document.getElementById('prompt');function render(){day.textContent=String(d).padStart(2,'0');fill.style.width=((d-1)*10)+'%';pct.textContent=((d-1)*10)+'%';prompt.textContent=P[d-1]}document.getElementById('begin').onclick=()=>{running=true;end=performance.now()+600000;prompt.textContent='Stay with the experience. Nothing to record.'};document.getElementById('next').onclick=()=>{if(d<10){d++;running=false;render()}};setInterval(()=>{if(running&&performance.now()>=end){running=false;if(d<10){d++;render()}else{fill.style.width='100%';pct.textContent='100%';prompt.textContent='The 10-day experience is complete. Remain for a moment.'}}},500);render();</script></body></html>
