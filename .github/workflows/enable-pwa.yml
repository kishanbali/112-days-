name: Enable KEMP EYE 112 PWA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add standard manifest link and service worker registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'href="./manifest.json"' not in s:
              s=s.replace('</title>', '</title><link rel="manifest" href="./manifest.json">', 1)
          if "serviceWorker.register('./service-worker.js')" not in s:
              code="<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script>"
              s=s.replace('</body>', code+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'KEMP PWA Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Enable 112-day Tracker PWA' && git push)
