<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>KEMP EYE 112 — Full Audit</title>
  <style>
    body{margin:0;background:#0a0d14;color:#fff;font-family:system-ui,sans-serif}
    .bar{position:sticky;top:0;z-index:10;padding:12px 14px;background:#111827;border-bottom:1px solid #374151;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
    .ok{background:#16a34a;color:white}.open{background:#2563eb;color:white}.small{font-size:12px;opacity:.8}
    iframe{display:block;width:100%;height:calc(100vh - 92px);border:0}
  </style>
</head>
<body>
  <div class="bar">
    <button class="ok" onclick="unlockAll()">✓ UNLOCK ALL 112 DAYS</button>
    <button class="open" onclick="reloadTracker()">↻ RELOAD TRACKER</button>
    <span class="small" id="status">Audit mode — locks are bypassed locally in this browser only.</span>
  </div>
  <iframe id="tracker" src="./index.html?audit=1"></iframe>
  <script>
    // Unlock every stage key used by the 112-day tracker for audit/testing.
    const ALL_STAGE_KEYS = ['L1','L2','L3','L4','L5','L6','L7','L8','L9','L10','L11','L12-20'];
    function unlockAll(){
      localStorage.setItem('kemp_unlocked_stages', JSON.stringify(ALL_STAGE_KEYS));
      document.getElementById('status').textContent = 'All stage locks unlocked for this browser. You can inspect Days 1–112.';
      reloadTracker();
    }
    function reloadTracker(){
      const frame=document.getElementById('tracker');
      frame.src='./index.html?audit=1&t='+Date.now();
    }
    // Set the audit unlock before the tracker loads.
    unlockAll();
  </script>
</body>
</html>
