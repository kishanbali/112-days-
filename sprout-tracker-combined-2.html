<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --soil:#1F3D2B;
    --soil-dark:#152A1E;
    --cream:#F6F2E9;
    --amber:#D9A441;
    --leaf:#5B8C5A;
    --leaf-light:#9FC49E;
    --line: rgba(246,242,233,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--soil-dark);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:28px 20px 18px;
    background:linear-gradient(180deg,var(--soil),var(--soil-dark));
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--leaf-light);
    font-size:13px;
  }
  .add-row{
    display:flex;
    gap:8px;
    padding:16px 20px 0;
  }
  .add-row input{
    flex:1;
    background:rgba(246,242,233,0.06);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--cream);
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .add-row input::placeholder{color:rgba(246,242,233,0.4);}
  .add-row button{
    background:var(--amber);
    color:var(--soil-dark);
    border:none;
    border-radius:10px;
    padding:0 18px;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  main{padding:20px;}
  .habit{
    background:rgba(246,242,233,0.04);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .habit-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .habit-name{
    font-weight:600;
    font-size:16px;
  }
  .streak{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:13px;
    color:var(--amber);
    font-weight:600;
  }
  .del{
    background:none;border:none;color:rgba(246,242,233,0.35);
    font-size:18px;cursor:pointer;padding:0 0 0 10px;line-height:1;
  }
  .week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .day{
    aspect-ratio:1;
    border-radius:8px;
    background:rgba(246,242,233,0.05);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:rgba(246,242,233,0.4);
    cursor:pointer;
    position:relative;
    transition:background .15s ease, transform .1s ease;
  }
  .day:active{transform:scale(0.92);}
  .day.done{
    background:var(--leaf);
    border-color:var(--leaf);
    color:var(--soil-dark);
    font-weight:600;
  }
  .day.today{border-color:var(--amber);}
  .empty{
    text-align:center;
    color:rgba(246,242,233,0.4);
    padding:60px 20px;
    font-size:14px;
    line-height:1.6;
  }
  .empty .big{font-size:34px;display:block;margin-bottom:10px;}
</style>
</head>
<body>

<header>
  <h1>🌱 Sprout</h1>
  <p>Tap a day to mark a habit done. Streaks grow with every day you don't skip.</p>
</header>

<div class="add-row">
  <input id="newHabit" type="text" placeholder="Add a habit — e.g. Read 10 pages" maxlength="40">
  <button onclick="addHabit()">Add</button>
</div>

<main id="list"></main>

<script>
const STORAGE_KEY = 'sprout-habits-v1';
const DAY_LABELS = ['S','M','T','W','T','F','S'];

function loadHabits(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function saveHabits(habits){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
}

function todayKey(offset=0){
  const d = new Date();
  d.setDate(d.getDate()+offset);
  return d.toISOString().slice(0,10);
}

function currentStreak(dates){
  let streak = 0;
  for(let i=0;i<365;i++){
    if(dates.includes(todayKey(-i))) streak++;
    else break;
  }
  return streak;
}

function addHabit(){
  const input = document.getElementById('newHabit');
  const name = input.value.trim();
  if(!name) return;
  const habits = loadHabits();
  habits.push({ id: Date.now().toString(), name, dates: [] });
  saveHabits(habits);
  input.value = '';
  render();
}

function toggleDay(habitId, dateKey){
  const habits = loadHabits();
  const habit = habits.find(h => h.id === habitId);
  if(!habit) return;
  const idx = habit.dates.indexOf(dateKey);
  if(idx >= 0) habit.dates.splice(idx,1);
  else habit.dates.push(dateKey);
  saveHabits(habits);
  render();
}

function deleteHabit(habitId){
  let habits = loadHabits();
  habits = habits.filter(h => h.id !== habitId);
  saveHabits(habits);
  render();
}

function render(){
  const habits = loadHabits();
  const list = document.getElementById('list');

  if(habits.length === 0){
    list.innerHTML = `<div class="empty"><span class="big">🌾</span>No habits yet.<br>Add one above to start your first streak.</div>`;
    return;
  }

  const todayStr = todayKey(0);
  list.innerHTML = habits.map(habit => {
    const streak = currentStreak(habit.dates);
    const days = [];
    for(let i=6;i>=0;i--){
      const key = todayKey(-i);
      const dateObj = new Date(key);
      const done = habit.dates.includes(key);
      const isToday = key === todayStr;
      days.push(`<div class="day ${done?'done':''} ${isToday?'today':''}"
        onclick="toggleDay('${habit.id}','${key}')">${done?'✓':DAY_LABELS[dateObj.getDay()]}</div>`);
    }
    return `
      <div class="habit">
        <div class="habit-top">
          <div class="habit-name">${escapeHtml(habit.name)}</div>
          <div style="display:flex;align-items:center;">
            <div class="streak">🔥 ${streak}</div>
            <button class="del" onclick="deleteHabit('${habit.id}')">✕</button>
          </div>
        </div>
        <div class="week">${days.join('')}</div>
      </div>`;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('newHabit').addEventListener('keydown', e => {
  if(e.key === 'Enter') addHabit();
});

render();
</script>
</body>
</html>
