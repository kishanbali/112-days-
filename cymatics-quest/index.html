<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050711"><title>KEMP EYE 👁 CYMATICS QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.app{width:min(720px,100%);height:100%;display:flex;flex-direction:column;background:radial-gradient(circle,#19152f,#050711 72%)}header{padding:16px;text-align:center;z-index:2}.brand{font-weight:900;letter-spacing:.18em}.sub{font-size:10px;letter-spacing:.2em;color:#a9aec2;margin-top:5px}.stage{position:relative;flex:1;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%}.eye{position:absolute;left:50%;top:50%;width:105px;height:68px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid #eee;border-radius:70% 12%;box-shadow:0 0 35px #8174ff;display:grid;place-items:center}.eye:before{content:"";width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff 0 9%,#8d7cff 10% 35%,#171329 36% 65%,transparent 66%);box-shadow:0 0 25px #8d7cff}.panel{padding:16px;background:linear-gradient(transparent,#050711 18%);text-align:center}.freq{font-size:38px;font-weight:900}.muted{font-size:11px;color:#9aa3bd}.row{display:flex;gap:10px;margin-top:12px}.btn{flex:1;border:1px solid #252b42;border-radius:14px;padding:14px;background:#11162a;color:#fff;font-weight:800}.primary{background:#8072ff;border:0}.note{font-size:9px;color:#717b95;margin-top:9px;line-height:1.5}</style></head><body><main class="app"><header><div class="brand">KEMP EYE 👁</div><div class="sub">CYMATICS QUEST · EXPERIENCE SOUND BECOMING FORM</div></header><section class="stage"><canvas id="c"></canvas><div class="eye"></div></section><section class="panel"><div class="freq"><span id="f">174</span> <span class="muted">HZ</span></div><div class="muted" id="time">10:00</div><div class="row"><button class="btn primary" id="start">▶ BEGIN EXPERIENCE</button><button class="btn" id="stop">■ STOP</button></div><div class="note">Browser-generated tone and artistic cymatic visualization. No external audio, accounts, tracking or data collection.</div></section></main><script>const F=[174,285,396,417,528,639,741,852,963];let fi=0,ctx,osc,gain,playing=false,end=0;const c=document.getElementById('c'),x=c.getContext('2d'),stage=document.querySelector('.stage'),fe=document.getElementById('f'),tm=document.getElementById('time');function size(){c.width=stage.clientWidth*devicePixelRatio;c.height=stage.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();function audio(){ctx=new(window.AudioContext||window.webkitAudioContext)();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.frequency.value=+fe.textContent;gain.gain.value=.045;osc.connect(gain).connect(ctx.destination);osc.start()}function stop(){if(osc){try{osc.stop()}catch(e){}osc=null}playing=false;tm.textContent='10:00'}document.getElementById('start').onclick=()=>{stop();audio();playing=true;end=performance.now()+600000};document.getElementById('stop').onclick=stop;function draw(t){let w=stage.clientWidth,h=stage.clientHeight,cx=w/2,cy=h/2,f=+fe.textContent;x.clearRect(0,0,w,h);for(let q=1;q<12;q++){x.beginPath();for(let a=0;a<Math.PI*2+.03;a+=.025){let r=35+q*24+Math.sin(a*(q+2)+t*.001*(1+f/700))*((q+3)*1.4);let xx=cx+Math.cos(a)*r,yy=cy+Math.sin(a)*r*.72;a<.03?x.moveTo(xx,yy):x.lineTo(xx,yy)}x.strokeStyle='rgba(160,145,255,'+(q*.012)+')';x.stroke()}if(playing){let s=Math.max(0,Math.ceil((end-performance.now())/1000));tm.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s)stop()}requestAnimationFrame(draw)}requestAnimationFrame(draw);setInterval(()=>{if(!playing){fi=(fi+1)%F.length;fe.textContent=F[fi]}},3500);</script></body></html>
